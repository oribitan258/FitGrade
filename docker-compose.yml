services:
  db:
    image: postgres:16-alpine
    container_name: fitgrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitgrade
      POSTGRES_PASSWORD: fitgrade_dev
      POSTGRES_DB: fitgrade
    ports:
      - "5432:5432"
    volumes:
      - fitgrade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgrade -d fitgrade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitgrade_pgdata:
