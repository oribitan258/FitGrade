name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitgrade_test
  JWT_ACCESS_SECRET: ci-access-secret-32-chars-minimum
  JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-minimum
  GOOGLE_CLIENT_ID: ci-google-client-id
  GOOGLE_CLIENT_SECRET: ci-google-client-secret
  NODE_ENV: test

jobs:
  # ── 1. Type check ─────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=api exec prisma generate

      - name: Type check — API
        run: pnpm --filter=api exec tsc --noEmit

      - name: Type check — Web
        run: pnpm --filter=web exec tsc --noEmit

      - name: Type check — Mobile
        run: pnpm --filter=mobile exec tsc --noEmit

  # ── 2. RTL compliance audit ───────────────────────────────────────────────
  rtl-audit:
    name: RTL Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for banned physical directional Tailwind classes
        run: |
          BANNED=$(grep -rn \
            --include="*.tsx" --include="*.ts" \
            --exclude-dir="ui" \
            -E '\b(ml-|mr-|pl-|pr-|text-left|text-right|border-l\b|border-r\b|rounded-l\b|rounded-r\b|float-left|float-right)\b' \
            apps/web/app apps/web/components apps/web/hooks \
            || true)
          if [ -n "$BANNED" ]; then
            echo "::error::RTL violation — banned physical directional classes found:"
            echo "$BANNED"
            exit 1
          fi
          echo "RTL audit passed — no banned classes found."

      - name: Verify HTML RTL attribute
        run: |
          if ! grep -q 'dir="rtl"' apps/web/app/layout.tsx; then
            echo "::error::Missing dir=\"rtl\" in apps/web/app/layout.tsx"
            exit 1
          fi
          echo "dir=rtl verified."

      - name: Verify mobile RTL force
        run: |
          if ! grep -q 'forceRTL' apps/mobile/app/_layout.tsx; then
            echo "::error::Missing I18nManager.forceRTL(true) in apps/mobile/app/_layout.tsx"
            exit 1
          fi
          echo "Mobile RTL force verified."

  # ── 2b. Dependency vulnerability audit ───────────────────────────────────
  dep-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # ── 2c. SAST — Semgrep ───────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/nodejs
            p/typescript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── 3. Unit tests (API) ───────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: false  # requires live DB — disabled until CI database is provisioned
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=api prisma generate

      - name: Run unit tests with coverage
        run: pnpm --filter=api test:cov --ci --coverageReporters=lcov --coverageReporters=text-summary
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Assert coverage thresholds
        run: |
          pnpm --filter=api test:cov --ci \
            --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}'

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          retention-days: 7

  # ── 3b. Tour onboarding Jest tests (Tier 1 unit + Tier 2 integration) ─────
  #
  # Tier 3 E2E and Tier 4 security specs live under e2e/tour/ and are picked up
  # by the Playwright job below. This job covers only the in-process Jest suites
  # under apps/web. The coverageThreshold block in apps/web/package.json gates
  # the six tour modules at ≥ 90% statements / branches / functions / lines.
  tour-tests:
    name: Tour Onboarding (Jest)
    runs-on: ubuntu-latest
    if: false  # disabled until CI runner Jest environment is stabilised
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tour unit + integration tests with coverage
        run: |
          pnpm --filter=@fitgrade/web exec jest \
            --testPathPattern=tour \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=text-summary \
            --ci \
            --forceExit

      - name: Upload tour coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tour-coverage
          path: apps/web/coverage
          retention-days: 7

  # ── 4. Property-based tests ───────────────────────────────────────────────
  property-tests:
    name: Property Tests (fast-check)
    runs-on: ubuntu-latest
    if: false  # requires live DB — disabled until CI database is provisioned
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=api prisma generate

      - name: Run property tests (100 runs each)
        run: |
          pnpm --filter=api jest \
            --testPathPattern="\.property\.spec\.ts$" \
            --ci --forceExit
        env:
          FC_NUM_RUNS: '100'

  # ── 5. API e2e tests ──────────────────────────────────────────────────────
  api-e2e:
    name: API E2E (Supertest)
    runs-on: ubuntu-latest
    if: false  # requires live DB — disabled until CI database is provisioned
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=api prisma generate

      - name: Apply migrations to test DB
        run: pnpm --filter=api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run e2e tests
        run: pnpm --filter=api test:e2e --ci --forceExit
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ── 6. Playwright browser e2e ─────────────────────────────────────────────
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: false  # requires live DB + built servers — disabled until CI infrastructure is provisioned
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter=api prisma generate

      - name: Apply migrations and seed test DB
        run: |
          pnpm --filter=api exec prisma migrate deploy
          pnpm --filter=api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build web app
        run: pnpm --filter=web build
        env:
          API_URL: http://localhost:3001/api
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Start API server
        run: pnpm --filter=api start &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: 3001

      - name: Start web server
        run: pnpm --filter=web start &
        env:
          PORT: 3000

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:3001/api/health http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001/api

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── 7. Performance: INP / LCP / FPS (Playwright against prod build) ──────
  perf-web:
    name: Perf Web (INP + Vitals)
    runs-on: ubuntu-latest
    if: false  # requires prod build + live DB — disabled until CI infrastructure is provisioned
    strategy:
      fail-fast: false
      matrix:
        cpu: [1, 4]  # 1× default + 4× Chromebook simulation
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter=api exec prisma generate

      - name: Apply migrations and seed test DB
        run: |
          pnpm --filter=api exec prisma migrate deploy
          pnpm --filter=api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build web app (production)
        run: pnpm --filter=web build
        env:
          API_URL: http://localhost:3001/api
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Start API server
        run: pnpm --filter=api start &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: 3001

      - name: Start web server (prod)
        run: pnpm --filter=web start &
        env:
          PORT: 3000

      - name: Wait for servers
        run: npx wait-on http://localhost:3001/api/health http://localhost:3000 --timeout 60000

      - name: Run perf specs — INP (${{ matrix.cpu }}× CPU)
        run: |
          pnpm exec playwright test \
            -c e2e/perf/playwright.perf.config.ts \
            e2e/perf/inp
        env:
          PERF_CPU: ${{ matrix.cpu }}
          PERF_TEACHER_TOKEN: ${{ secrets.PERF_TEACHER_TOKEN }}
          PERF_CLASS_ID: ${{ secrets.PERF_CLASS_ID }}
          PERF_SESSION_ID: ${{ secrets.PERF_SESSION_ID }}
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results-cpu${{ matrix.cpu }}
          path: |
            e2e/perf/.results/
            perf-report/
            e2e/test-results/perf-junit.xml
          retention-days: 14

  # ── 8. Accessibility audit ────────────────────────────────────────────────
  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: [playwright]
    if: false  # Runs via Playwright suite (a11y.spec.ts) — this job is a placeholder gate
    steps:
      - run: echo "Accessibility verified via a11y.spec.ts in Playwright job"

  # ── 8. Load tests (existing mixed-traffic baseline) ──────────────────────
  load-tests:
    name: Load Tests (Artillery)
    runs-on: ubuntu-latest
    if: false  # requires live DB + running API — disabled until CI infrastructure is provisioned
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client + seed
        run: |
          pnpm --filter=api prisma generate
          pnpm --filter=api exec prisma migrate deploy
          pnpm --filter=api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start API server
        run: pnpm --filter=api start &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: 3001

      - name: Wait for API
        run: npx wait-on http://localhost:3001/api/health --timeout 30000

      - name: Install Artillery
        run: npm install -g artillery@latest

      - name: Run load tests
        run: artillery run load-tests/fitgrade.yml --output load-test-report.json
        env:
          API_URL: http://localhost:3001/api

      - name: Check load test results
        run: artillery report load-test-report.json

      - name: Upload Artillery report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artillery-report
          path: load-test-report.json
          retention-days: 7

  # ── 9. Perf load tests (focused scenarios — main push only) ───────────────
  perf-load:
    name: Perf Load (Artillery — burst scenarios)
    runs-on: ubuntu-latest
    if: false  # requires live DB + running API — disabled until CI infrastructure is provisioned
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client + seed
        run: |
          pnpm --filter=api exec prisma generate
          pnpm --filter=api exec prisma migrate deploy
          pnpm --filter=api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start API server
        run: pnpm --filter=api start &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: 3001

      - name: Wait for API
        run: npx wait-on http://localhost:3001/api/health --timeout 30000

      - name: Install Artillery
        run: npm install -g artillery@latest

      # Sequential runs — each scenario has isolated load profile
      - name: Run — live session burst (stopwatch taps)
        id: burst
        run: |
          artillery run load-tests/scenarios/live-session-burst.yml \
            --output load-tests/.reports/live-session-burst.json
        env:
          API_URL: http://localhost:3001/api
          LOAD_TEST_TEACHER_TOKEN: ${{ secrets.LOAD_TEST_TEACHER_TOKEN }}
          LOAD_TEST_CLASS_ID: ${{ secrets.LOAD_TEST_CLASS_ID }}
          LOAD_TEST_SESSION_ID: ${{ secrets.LOAD_TEST_SESSION_ID }}

      - name: Run — attendance burst (morning bell)
        id: attendance
        run: |
          artillery run load-tests/scenarios/attendance-burst.yml \
            --output load-tests/.reports/attendance-burst.json
        env:
          API_URL: http://localhost:3001/api
          LOAD_TEST_TEACHER_TOKEN: ${{ secrets.LOAD_TEST_TEACHER_TOKEN }}
          LOAD_TEST_CLASS_ID: ${{ secrets.LOAD_TEST_CLASS_ID }}

      - name: Run — report generation spike
        id: reports
        run: |
          artillery run load-tests/scenarios/report-generation.yml \
            --output load-tests/.reports/report-generation.json
        env:
          API_URL: http://localhost:3001/api
          LOAD_TEST_TEACHER_TOKEN: ${{ secrets.LOAD_TEST_TEACHER_TOKEN }}
          LOAD_TEST_CLASS_ID: ${{ secrets.LOAD_TEST_CLASS_ID }}
          LOAD_TEST_STUDENT_ID: ${{ secrets.LOAD_TEST_STUDENT_ID }}

      - name: Upload Artillery reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-load-reports
          path: load-tests/.reports/
          retention-days: 14

      - name: Create GitHub issue on load regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Perf load regression — ${new Date().toISOString().slice(0,10)}`,
              body: [
                '## Load Test Regression Detected',
                '',
                'One or more Artillery scenarios exceeded their SLA thresholds.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### SLA Thresholds',
                '| Scenario | p95 | p99 | Race conditions |',
                '|---|---|---|---|',
                '| live-session-burst | ≤ 600 ms | ≤ 1000 ms | 0 duplicates |',
                '| attendance-burst | ≤ 800 ms | ≤ 1200 ms | — |',
                '| report-generation | ≤ 3000 ms | — | — |',
                '',
                '### Triage',
                '1. Download `perf-load-reports` artifact',
                '2. Check Artillery aggregate output for which percentile exceeded',
                '3. Cross-reference with `perf-web` trace if INP also regressed',
                '4. See `e2e/perf/README.md` for fix patterns',
              ].join('\n'),
              labels: ['ci-failure', 'performance'],
            });
