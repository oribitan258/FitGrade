name: Nightly

on:
  schedule:
    
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitgrade_test
  JWT_ACCESS_SECRET: nightly-access-secret-32-chars-min
  JWT_REFRESH_SECRET: nightly-refresh-secret-32-chars-min
  GOOGLE_CLIENT_ID: nightly-google-client-id
  GOOGLE_CLIENT_SECRET: nightly-google-client-secret
  NODE_ENV: test

jobs:
  # ── Exhaustive property tests (10,000 runs) ───────────────────────────────
  property-exhaustive:
    name: Property Tests — 10k runs (fast-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=api prisma generate

      - name: Run property tests — 10,000 runs each
        run: |
          pnpm --filter=api jest \
            --testPathPattern="\.property\.spec\.ts$" \
            --ci --forceExit --verbose
        env:
          FC_NUM_RUNS: '10000'

  # ── Stryker mutation testing ──────────────────────────────────────────────
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=api prisma generate

      - name: Run Stryker mutation testing
        run: pnpm --filter=api exec stryker run
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload Stryker report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: apps/api/reports/mutation/
          retention-days: 14

  # ── DST / timezone chaos tests ────────────────────────────────────────────
  timezone-chaos:
    name: Timezone Chaos (DST boundaries)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client + seed
        run: |
          pnpm --filter=api prisma generate
          pnpm --filter=api exec prisma migrate deploy
          pnpm --filter=api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TZ: Asia/Jerusalem

      - name: Run timezone chaos suite
        run: pnpm exec playwright test e2e/chaos/timezone.spec.ts --project=chromium
        env:
          TZ: Asia/Jerusalem
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001/api

  # ── Concurrent sessions (two browser contexts) ────────────────────────────
  concurrent-sessions:
    name: Concurrent Sessions Race Conditions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client + seed
        run: |
          pnpm --filter=api prisma generate
          pnpm --filter=api exec prisma migrate deploy
          pnpm --filter=api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run concurrent sessions suite
        run: pnpm exec playwright test e2e/chaos/concurrent-sessions.spec.ts --project=chromium
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001/api

  # ── Weekly perf load (Artillery burst scenarios) ─────────────────────────
  perf-load:
    name: Perf Load (Artillery — weekly burst)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client + seed
        run: |
          pnpm --filter=api exec prisma generate
          pnpm --filter=api exec prisma migrate deploy
          pnpm --filter=api exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start API server
        run: pnpm --filter=api start &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: 3001

      - name: Wait for API
        run: npx wait-on http://localhost:3001/api/health --timeout 30000

      - name: Install Artillery
        run: npm install -g artillery@latest

      - name: Run — baseline mixed traffic
        run: |
          artillery run load-tests/fitgrade.yml \
            --output load-tests/.reports/nightly-baseline.json
        env:
          API_URL: http://localhost:3001/api
          LOAD_TEST_TEACHER_TOKEN: ${{ secrets.LOAD_TEST_TEACHER_TOKEN }}
          LOAD_TEST_CLASS_ID: ${{ secrets.LOAD_TEST_CLASS_ID }}
          LOAD_TEST_SESSION_ID: ${{ secrets.LOAD_TEST_SESSION_ID }}

      - name: Run — live session burst
        run: |
          artillery run load-tests/scenarios/live-session-burst.yml \
            --output load-tests/.reports/nightly-live-burst.json
        env:
          API_URL: http://localhost:3001/api
          LOAD_TEST_TEACHER_TOKEN: ${{ secrets.LOAD_TEST_TEACHER_TOKEN }}
          LOAD_TEST_CLASS_ID: ${{ secrets.LOAD_TEST_CLASS_ID }}
          LOAD_TEST_SESSION_ID: ${{ secrets.LOAD_TEST_SESSION_ID }}

      - name: Run — attendance burst
        run: |
          artillery run load-tests/scenarios/attendance-burst.yml \
            --output load-tests/.reports/nightly-attendance.json
        env:
          API_URL: http://localhost:3001/api
          LOAD_TEST_TEACHER_TOKEN: ${{ secrets.LOAD_TEST_TEACHER_TOKEN }}
          LOAD_TEST_CLASS_ID: ${{ secrets.LOAD_TEST_CLASS_ID }}

      - name: Run — report generation
        run: |
          artillery run load-tests/scenarios/report-generation.yml \
            --output load-tests/.reports/nightly-reports.json
        env:
          API_URL: http://localhost:3001/api
          LOAD_TEST_TEACHER_TOKEN: ${{ secrets.LOAD_TEST_TEACHER_TOKEN }}
          LOAD_TEST_CLASS_ID: ${{ secrets.LOAD_TEST_CLASS_ID }}
          LOAD_TEST_STUDENT_ID: ${{ secrets.LOAD_TEST_STUDENT_ID }}

      - name: Upload Artillery nightly reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-load-nightly
          path: load-tests/.reports/
          retention-days: 30

  # ── Notify on failure ─────────────────────────────────────────────────────
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [property-exhaustive, mutation, timezone-chaos, concurrent-sessions, perf-load]
    if: failure()
    steps:
      - name: Create GitHub issue on nightly failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly CI failure — ${new Date().toISOString().slice(0,10)}`,
              body: `Nightly pipeline failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure', 'nightly'],
            });
